[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored forks keep their own workspaces and lockfiles.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aphrody-dev/aysh"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
